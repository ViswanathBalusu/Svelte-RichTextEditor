<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harness: doc-editor on a corpus document (FND-007)</title>
    <script>
      // Observers first, before any module runs, so that no long task, paint or event is missed.
      (function () {
        var h = (window.__perf = {
          longTasks: [],
          events: [],
          paints: [],
          keydowns: [],
          frames: [],
        });
        function watch(type, list, extra) {
          try {
            new PerformanceObserver(function (l) {
              l.getEntries().forEach(function (e) {
                list.push(e.toJSON());
              });
            }).observe(Object.assign({ type: type, buffered: true }, extra || {}));
          } catch (err) {
            h['no-' + type] = String(err);
          }
        }
        watch('longtask', h.longTasks);
        watch('paint', h.paints);
        watch('event', h.events, { durationThreshold: 16 });
        watch('first-input', h.events);
        // A second, uncensored estimate of keystroke-to-paint: from the event's time stamp to the
        // first task after the next animation frame, which runs once that frame is produced.
        addEventListener(
          'keydown',
          function (e) {
            var start = e.timeStamp;
            requestAnimationFrame(function () {
              var c = new MessageChannel();
              c.port1.onmessage = function () {
                h.frames.push(performance.now() - start);
              };
              c.port2.postMessage(0);
            });
            h.keydowns.push(start);
          },
          true,
        );
      })();
    </script>
    <style>
      body {
        margin: 0;
      }
      doc-editor {
        width: 1100px;
      }
    </style>
    <script type="module" src="../src/browser/editor-page.ts"></script>
  </head>
  <body></body>
</html>
