<!doctype html>
<!--
  The PDF viewer's page (FE-071; 09 §9.3 rule 7). The element loads it in a sandboxed frame from
  another origin; it talks only over the MessagePort the element hands it. Its text comes from the
  element (src/strings.ts), so this file holds none.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <div class="toolbar" role="toolbar" hidden>
      <button type="button" data-action="previous"></button>
      <span class="status" role="status" aria-live="polite"></span>
      <button type="button" data-action="next"></button>
      <span class="gap"></span>
      <button type="button" data-action="zoom-out"></button>
      <span class="zoom"></span>
      <button type="button" data-action="zoom-in"></button>
    </div>
    <main class="pages" tabindex="0">
      <canvas class="page" role="img"></canvas>
      <p class="message" role="alert" hidden></p>
    </main>
  </body>
</html>
