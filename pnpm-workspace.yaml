# Package layout of 01 §6. Packages are created only when their first story needs them (FND-001).
packages:
  - packages/*
  - services/*
  - apps/*
  # Cross-cutting test suites that belong to no one package: security proofs (PLAN-1a packet F).
  - tests/*

# pnpm refuses releases younger than its minimum release age (supply-chain hygiene). Playwright is
# pinned to its newest release so that the browser builds match the supported versions (FND-002).
minimumReleaseAgeExclude:
  - playwright-core@1.65.0
  - playwright@1.65.0
  - '@playwright/test@1.65.0'

# Dependencies run no install scripts unless they are listed here as true (supply-chain hygiene, SEC
# epic). esbuild 0.21.5 comes with VitePress 1 of the documentation site (FND-013). Its install script
# only checks the binary that its platform package already provides, so it stays off. It is named
# because pnpm 12 fails an install that has a script nobody has decided on. The empty
# `onlyBuiltDependencies` list stays: tests/security checks it.
allowBuilds:
  esbuild: false

onlyBuiltDependencies: []
