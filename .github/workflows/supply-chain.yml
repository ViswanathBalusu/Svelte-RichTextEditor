# Supply-chain checks (SEC-052, SEC-054; ADR 0044).
#
# On every change to a container definition, a compose file, a workflow or these checks: base
# images pinned by digest and built with Podman, compose images pinned, actions pinned to a commit,
# Podman called through DOCEDIT_CONTAINER_CLI (scripts/supply-chain/pin-check.ts). Weekly, and by
# hand: pinned bases whose tag has moved upstream (a prompt to review and move the pin), and the
# signatures of the latest published release's images (scripts/release/verify.ts).
name: supply-chain

on:
  pull_request:
    paths:
      - '**/Containerfile'
      - '**/Containerfile.*'
      - '**/*.Containerfile'
      - '**/Dockerfile*'
      - '**/compose*.json'
      - '**/compose*.yml'
      - '**/compose*.yaml'
      - '.github/**'
      - 'scripts/**'
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # An explicit bash adds -o pipefail, so a failure inside a pipe fails the step.
    shell: bash

jobs:
  pins:
    name: Pinned bases, images and actions; Podman only (SEC-052)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Pin check (scripts/supply-chain/pin-check.ts)
        run: node scripts/supply-chain/pin-check.ts --json pin-check.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: pin-check
          path: pin-check.json
          if-no-files-found: ignore

  origins:
    name: The editor bundle loads no third-party code (SEC-054)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @docedit/element build
      - name: Origin check of the build output (scripts/supply-chain/origin-check.ts)
        run: |
          node scripts/supply-chain/origin-check.ts packages/element/dist/lib --package packages/element \
            --exclude bundle-report.json --json origin-check.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: origin-check
          path: origin-check.json
          if-no-files-found: ignore

  base-drift:
    name: Pinned bases whose tag moved upstream
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Compare each pin with its tag (skopeo, preinstalled on the runner)
        run: |
          skopeo --version
          node scripts/supply-chain/base-drift.ts >> "$GITHUB_STEP_SUMMARY"

  signatures:
    name: Signatures of the latest release's images (SEC-052)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify every image of the latest release (scripts/release/verify.ts)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release list --repo "${GITHUB_REPOSITORY}" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [ -z "${tag}" ]; then
            echo "No published release yet; nothing to verify." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" --pattern release-manifest.json --dir latest
          node scripts/release/verify.ts latest/release-manifest.json --repository "${GITHUB_REPOSITORY}" | tee -a "$GITHUB_STEP_SUMMARY"
