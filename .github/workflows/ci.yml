# Continuous integration (FND-002). Every pull request must pass all jobs before it merges
# (configure the branch protection rule to require them).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly: everything above, plus the long convergence run against PostgreSQL (SYN-047).
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, unit tests, build
    runs-on: ubuntu-24.04
    # The first hosted run needed 2 minutes for lint, 6 for the type-check and was still in the unit
    # tests after 12 more, when the old limit of 20 minutes cancelled the job.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and formatting
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Architecture boundaries (FND-004)
        run: pnpm deps:check
      - name: Licence gate (FND-011)
        run: pnpm licence:check
      - name: Fetch the base branch, for the class release ledger test (EXP-015)
        # The checkout is one commit deep. The test compares the class and its ledger with the base
        # revision, so that a released entry rewritten in place fails; it skips without the base.
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: git fetch --no-tags --depth=1 origin "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"
      - name: Unit and property tests in Node.js, without a browser (02 §12)
        env:
          DOCEDIT_CLASS_BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: pnpm test -- --reporter=default --reporter=junit --outputFile.junit=test-results/node.xml
      - name: Generated artifacts are current (CDM-007)
        run: |
          pnpm generate
          git diff --exit-code -- spec packages/model/src/generated packages/tck/fixtures
      - name: Actions and base images are pinned (SEC-052)
        run: pnpm pins:check
      - name: Build
        run: pnpm build
      - name: The editor bundle loads nothing from other origins (SEC-054)
        run: pnpm origins:check
      - name: Stories are well-formed
        shell: pwsh
        run: |
          pwsh -NoProfile -File docs/stories/tools/check-stories.ps1 | Tee-Object -Variable out
          if ($out -match '== Problems \((?!0\))') { exit 1 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: node-test-results
          path: test-results/
          if-no-files-found: ignore

  browsers:
    name: Browser tests (${{ matrix.browser }})
    # FE-121 criterion 4: the browser run starts only after the Node.js tests of `check` pass.
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported versions (02 §12): Chrome and Edge 137, Firefox 142, Safari 17.
        # Playwright 1.65 ships newer engines than these minimums; the minimums are pinned for the
        # build targets in tsconfig.base.json (ES2023) and checked against real releases in the
        # scheduled compatibility run (to be added with the first browser-facing package).
        include:
          - browser: chromium
            os: ubuntu-24.04
          - browser: msedge
            os: ubuntu-24.04
          - browser: firefox
            os: ubuntu-24.04
          - browser: webkit
            os: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Universal tests in ${{ matrix.browser }} (FND-003, FND-005)
        env:
          DOCEDIT_BROWSERS: ${{ matrix.browser }}
        run: pnpm exec vitest run --project browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-${{ matrix.browser }}-traces
          path: |
            test-results/
            playwright-report/
            .vitest-attachments/
          if-no-files-found: ignore

  kernel:
    # The layout kernel (ADR 0016; WASM-001) is Rust compiled to WebAssembly in the pinned builder
    # image under Podman (packages/layout-kernel/scripts/build.ts). Its build output, dist/, is not
    # committed. The element's demo build imports it, so the e2e jobs of the element need it; the
    # tests of the kernel skip without it, so this job runs them against the fresh build.
    name: Layout kernel build and tests (WASM-001)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: podman --version
      - name: Build the kernel to WebAssembly in the builder image
        run: pnpm --filter @docedit/layout-kernel build:wasm
      - name: Tests of the kernel, the layout and the element against the build
        run: pnpm --filter @docedit/layout-kernel test:layout
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: layout-kernel-dist
          path: packages/layout-kernel/dist/
          if-no-files-found: error
  e2e:
    # FND-002 criteria 2 to 4: the Playwright suites of the element and of the shell, with their axe
    # checks (an axe violation fails its test, so it fails the job), in each supported browser.
    # Playwright 1.65 ships engines newer than the minimums of 02 §12 (Chrome and Edge 137,
    # Firefox 142, Safari 17). The minimums are pinned as the build target of every component build
    # (`BROWSER_MINIMUMS` in packages/element/scripts/vite-configs.ts, checked by
    # packages/element/test/browser-support.test.ts in the check job), so the code these suites load
    # is built for them. Safari itself is not run: Playwright's WebKit is the closest it gets.
    name: Playwright suites with axe, ${{ matrix.suite }} (${{ matrix.browser }})
    needs: kernel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [element, ui]
        browser: [chromium, msedge, firefox, webkit]
        include:
          # WebKit runs on Linux here, as the other engines do. The suites were written and pass with
          # Playwright's WebKit on Windows and Linux. On macOS the system setting "Press Tab to
          # highlight each item" is off, so Tab never reaches a button (the focus order tests fail),
          # Control+B is not Bold, and native selects are 23 pixels high. A macOS run of the shell
          # is a separate decision (see the report of the CI work of 2026-11-21).
          - os: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: layout-kernel-dist
          path: packages/layout-kernel/dist/
      - name: Browser version
        run: node scripts/ci/browser-version.ts ${{ matrix.browser }} | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Playwright suite of packages/${{ matrix.suite }} in ${{ matrix.browser }}
        env:
          # packages/ui picks its projects from DOCEDIT_BROWSERS; packages/element from --project.
          DOCEDIT_BROWSERS: ${{ matrix.browser }}
        run: pnpm exec playwright test -c packages/${{ matrix.suite }}/playwright.config.ts --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Always: the JSON results of every run, and the traces and screenshots Playwright keeps for
        # failed tests (`trace: retain-on-failure`, `screenshot: only-on-failure`).
        if: always()
        with:
          name: e2e-${{ matrix.suite }}-${{ matrix.browser }}
          path: packages/${{ matrix.suite }}/test-results/
          if-no-files-found: warn

  visual:
    # The screenshot baselines of the shell (UX-064 criterion 7) for Linux were recorded in the
    # Playwright container, and pixels depend on the fonts of the machine, so the spec compares them
    # only there (it skips on a bare Linux runner). The image is the one of the Playwright version
    # in package.json (v1.65.0), pinned by digest. To record new baselines: run the script with
    # `--update-snapshots` (scripts/ci/visual-in-container.sh).
    name: Visual regression in the Playwright container (UX-064)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the visual spec in chromium, firefox and webkit
        run: |
          podman run --rm --ipc=host -v "$PWD:/work" -w /work \
            mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe \
            sh scripts/ci/visual-in-container.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: visual-diffs
          path: packages/ui/test-results/
          if-no-files-found: ignore

  dependency-review:
    # SEC-050 criterion 2: a pull request that adds or changes a dependency gets a review of known
    # advisories. Licences are checked by the licence gate in the check job, and install scripts stay
    # off unless allow-listed (pnpm-workspace.yaml: `onlyBuiltDependencies` is empty).
    name: Dependency review (SEC-050)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  bundle-report:
    # FND-008 criterion 4: the bundle report of the pull request, compared with the base branch.
    # It goes to the job summary and to an artifact on every pull request, and to a comment on the
    # pull request when a chunk changes size. The comment is a courtesy: a pull request from a
    # fork has a read-only token, and the step then fails without failing the job.
    name: Bundle report (FND-008)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build this change
        run: pnpm --filter @docedit/element build
      - name: Build the base, when it can be built (its report may be missing)
        working-directory: base
        continue-on-error: true
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @docedit/element build
      - name: Compare the two reports
        run: |
          base=-
          if [ -f base/packages/element/dist/lib/bundle-report.json ]; then
            base=base/packages/element/dist/lib/bundle-report.json
          fi
          node packages/element/scripts/bundle-diff.ts "$base" packages/element/dist/lib/bundle-report.json bundle-summary.md
          cat bundle-summary.md >> "$GITHUB_STEP_SUMMARY"
          if grep -q 'alters the size' bundle-summary.md; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
        id: compare
      - name: Comment on the pull request when a chunk changes size
        if: steps.compare.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file bundle-summary.md --edit-last --create-if-none
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bundle-report
          path: |
            bundle-summary.md
            packages/element/dist/lib/bundle-report.json
          if-no-files-found: ignore

  conformance-kit:
    # The conformance kit (packages/tck; ADR 0042): the independent canonical-form implementation
    # in Python against the model's fixtures (CDM-011), the kit's own tests with its targets
    # (backend-mock and the reference service in process), and its Podman image.
    name: Conformance kit (PRO-108 to PRO-117, CDM-011)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Canonical form in Python, against the model's fixtures (Python 3 is preinstalled)
        run: python3 -I packages/model/conformance/canonical.py spec/cdm/cdm-1.prosemirror.json packages/model/fixtures/canonical/index.json
      - name: The kit's tests and its targets
        run: pnpm exec vitest run --project node packages/tck
      - name: The kit's image builds with Podman
        run: podman build -t docedit-tck:ci -f packages/tck/Containerfile .

  integration:
    # The integration-test environment (FND-010): PostgreSQL and the S3-compatible store in
    # containers started with Podman (never Docker), clean on each run and removed afterwards.
    name: Integration tests against PostgreSQL (FND-010, SYN-047)
    runs-on: ubuntu-24.04
    # Runs the whole Node.js suite (as the check job does) against the containers: the first hosted run
    # was still in the tests when the old limit of 30 minutes cancelled it.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: podman --version
      - name: Install poppler-utils, the compile tests read the PDFs with pdftotext and pdftoppm
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends poppler-utils
      - name: Pull the pinned veraPDF image (the reference is in services/export-worker/src/verapdf.ts)
        run: |
          image="$(node --input-type=module -e "import { VERAPDF_IMAGE } from './services/export-worker/src/verapdf.ts'; console.log(VERAPDF_IMAGE);")"
          podman pull "$image"
      - name: Build the asset worker sandbox image (PRO-114 runs its sandbox)
        run: node services/asset-worker/scripts/build-image.ts
      - name: Start the environment with the export worker, run the Node.js tests against it, tear it down
        shell: pwsh
        env:
          # The export worker image is built here, as in the export job (same tag, same reason). The
          # tests that need the environment (S3 store, worker image) fail, not skip, because
          # infra/test-env.ps1 run sets DOCEDIT_TEST_ENV=1.
          DOCEDIT_EXPORT_IMAGE: localhost/docedit-export-worker:test
        run: pwsh -NoProfile -File infra/test-env.ps1 run pnpm test

  export:
    # The export pipeline with its real tools: the worker image is built, and the tests of the
    # export worker and of the LaTeX converter compile in the single-use sandbox and validate with
    # veraPDF. This is the reference corpus of EXP-016, the stored references of EXP-114, the
    # sandbox environment of SEC-035 and the compile-level tests that skip in the other jobs.
    # DOCEDIT_REQUIRE_SANDBOX makes a missing sandbox or veraPDF image a failure, not a skip.
    name: Export tests in the sandbox, with veraPDF (EXP-016, EXP-114, SEC-035)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: podman --version
      - name: Install poppler-utils, the compile tests read the PDFs with pdftotext and pdftoppm
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends poppler-utils
      - name: Pull the pinned veraPDF image (the reference is in services/export-worker/src/verapdf.ts)
        run: |
          image="$(node --input-type=module -e "import { VERAPDF_IMAGE } from './services/export-worker/src/verapdf.ts'; console.log(VERAPDF_IMAGE);")"
          podman pull "$image"
      - name: Start the environment with the export worker, run the export tests, tear it down
        shell: pwsh
        env:
          DOCEDIT_REQUIRE_SANDBOX: '1'
          # The tests default to the tag :s4; infra/test-env.ps1 builds the image under the tag of
          # DOCEDIT_EXPORT_IMAGE in infra/containers/.env.example. The two must name the same image,
          # or the compile tests find no image and fail (or skip) with "not built".
          DOCEDIT_EXPORT_IMAGE: localhost/docedit-export-worker:test
        run: pwsh -NoProfile -File infra/test-env.ps1 run pnpm exec vitest run --project node services/export-worker packages/export-latex

  fuzz:
    # SEC-059 criterion 3 and SYN-049 criterion 3: every pull request runs the fuzz targets bounded
    # (they are part of `pnpm test`); this job is the longer nightly run. The two lengths below are
    # provisional, not figures from the specification: set the repository variables
    # FUZZ_RUNS_NIGHTLY (generated inputs per target of 10 §5) and FUZZ_MS_NIGHTLY (time box of the
    # authority fuzzer, in milliseconds) to change them (ADR 0121 item 39 leaves them to the owner).
    name: Fuzz targets, the longer nightly run (SEC-059, SYN-049)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      FUZZ_RUNS: ${{ vars.FUZZ_RUNS_NIGHTLY || '2000' }}
      FUZZ_MS: ${{ vars.FUZZ_MS_NIGHTLY || '600000' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The targets of 10 §5 with FUZZ_RUNS generated inputs each (SEC-059)
        run: pnpm exec vitest run --project node tests/security/test/fuzz.test.ts
      - name: The authority fuzzer for FUZZ_MS (SYN-049)
        # The test has no time limit of its own, so the limit is the time box plus two minutes.
        if: always()
        run: pnpm exec vitest run --project node packages/authority/test/fuzz.test.ts --testTimeout=$((FUZZ_MS + 120000))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # A crash is saved as a minimised case; keep it so that it can be committed as a regression.
        if: failure()
        with:
          name: fuzz-crashes
          path: |
            tests/security/corpus/fuzz/
            tests/security/corpus/fuzz-inflight/
          if-no-files-found: ignore

  convergence-nightly:
    name: Convergence suite against PostgreSQL, 3,000 schedules (SYN-047)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: SYN-047 with 3,000 schedules
        shell: pwsh
        env:
          SYN047_RUNS: '3000'
        # Only the two convergence suites run here (the whole suite runs in the integration job). Under
        # `-NoExport` the tests that need the export worker or the asset worker image fail, because
        # infra/test-env.ps1 run sets DOCEDIT_TEST_ENV=1, so `pnpm test` would fail for the wrong reason.
        run: pwsh -NoProfile -File infra/test-env.ps1 run -NoExport pnpm exec vitest run --project node convergence.pg.test.ts

  fuzz-nightly:
    # SEC-059 criterion 3. A pull request runs every fuzz target bounded, inside `pnpm test` (200
    # generated inputs per target). This is the longer run. FUZZ_RUNS is a proposed value, not a
    # figure from the spec (SEC-059 Notes): it is the run the story's evidence was taken with.
    name: Fuzz targets, longer run (SEC-059)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Every registered fuzz target with 5,000 generated inputs
        env:
          FUZZ_RUNS: '5000'
        run: pnpm exec vitest run --project node tests/security/test/fuzz.test.ts
      - name: Keep the failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings
          path: |
            tests/security/corpus/fuzz
            tests/security/corpus/fuzz-inflight
          if-no-files-found: ignore

  summary:
    name: Pipeline duration
    needs:
      [
        check,
        browsers,
        e2e,
        kernel,
        visual,
        conformance-kit,
        integration,
        export,
        fuzz,
        convergence-nightly,
        fuzz-nightly,
      ]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Report the duration of every job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs \
            --jq '.jobs[] | select(.completed_at != null) | "\(.name): \(((.completed_at | fromdate) - (.started_at | fromdate)))s"' \
            | tee -a "$GITHUB_STEP_SUMMARY"
