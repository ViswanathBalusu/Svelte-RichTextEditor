# SEC-050 criterion 3: a daily scan of the shipped dependency tree (production dependencies of every
# workspace package) for published advisories. When there are any, it opens an issue, or comments
# on the open one.
name: advisories

on:
  schedule:
    - cron: '11 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    name: Advisories in the shipped dependency tree (SEC-050)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit the production dependencies
        id: audit
        run: |
          set +e
          pnpm audit --prod --json > audit.json
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Summarise the advisories
        if: steps.audit.outputs.code != '0'
        run: |
          node -e '
            const fs = require("node:fs");
            let out = "The daily scan found advisories in the shipped dependency tree (SEC-050).\n\n";
            try {
              const a = JSON.parse(fs.readFileSync("audit.json", "utf8"));
              const list = Object.values(a.advisories ?? {});
              out += "| Package | Severity | Advisory | Vulnerable versions |\n|---|---|---|---|\n";
              for (const v of list) out += `| ${v.module_name} | ${v.severity} | [${v.title}](${v.url}) | ${v.vulnerable_versions} |\n`;
              out += `\nCounts: ${JSON.stringify(a.metadata?.vulnerabilities ?? {})}\n`;
            } catch (e) {
              out += "The audit output could not be read: " + e.message + "\n";
            }
            out += `\nRun: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}\n`;
            fs.writeFileSync("summary.md", out);
          '
      - name: Open an issue, or comment on the open one
        if: steps.audit.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Advisories in the shipped dependency tree"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file summary.md
          else
            gh issue create --title "$title" --body-file summary.md
          fi
