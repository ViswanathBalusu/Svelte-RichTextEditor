[package]
name = "docedit-sea-segmenter"
description = "Word-boundary line breaking for Thai, Lao, Khmer and Burmese, compiled to a WebAssembly module of its own that a page loads only when a document uses one of these scripts (WASM-016)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[lints]
workspace = true

# Exact versions, so that Cargo.lock and the licence check agree (owner decision 282: the ICU4X
# segmenter and its data). The dictionary data is compiled into this module and into no other.
[dependencies]
wasm-bindgen = "=0.2.130"
icu_segmenter = { version = "=2.4.0", default-features = false, features = ["compiled_data", "auto"] }
